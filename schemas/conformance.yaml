# Maps each schema to the files it governs, for
# scripts/validate_data_conformance.py. validate_schemas.py checks the
# schema files themselves; this file is what makes them constrain the
# data they describe.
version: 1
mappings:
  - schema: decision-record.schema.json
    files: ["decisions/model-swap/*.md"]
    records: frontmatter
  - schema: route.schema.json
    files: ["config/routes.yaml"]
    records: self
